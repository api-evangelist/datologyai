aid: datologyai
name: DatologyAI
description: 'DatologyAI is a data curation and optimization platform that automatically
  identifies, prioritizes, and curates training data at petabyte scale so teams can
  train machine learning and foundation models that are better, faster, and smaller.
  Founded on the principle that "models are what they eat," its research-driven pipeline
  improves model quality while cutting compute cost and training time, and is used
  by AI labs and enterprises building frontier open models. The company is venture-backed
  by Amplify Partners and Felicis. DatologyAI operates as an enterprise, contact-sales
  service and does not currently publish a public developer API, SDKs, or documentation
  portal.'
